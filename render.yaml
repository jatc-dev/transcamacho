services:
  - type: web
    name: transcamacho-nextjs
    env: docker
    rootDir: .
    envVars:
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: transcamacho-db
          property: connectionString
    buildArgs:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      DATABASE_URL: ${DATABASE_URL}
databases:
  - name: transcamacho-db
    plan: starter
